name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

  typecheck:
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  security-checks:
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # If a prod high has no fix, add `continue-on-error: true` here with a
      # comment naming the advisory, and remove it once a patched release ships.
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Criticals block even in dev deps: they run during npm ci and builds.
      - name: Dependency audit (all, critical, blocking)
        run: npm audit --audit-level=critical

      # ponytail: dev-only highs don't gate merges. Today that's braces@3.0.3 via
      # eslint-config-next > fast-glob (GHSA-vfj7-8cjw-p6xm, no patched release;
      # glob input is our own eslint config). Make this blocking once it's clean.
      - name: Dependency audit (all, informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify lockfile integrity
        run: npm ls --depth=0

      - name: Run security scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test-and-lint, security-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js project
        run: npm run build